# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). The app transcribes on the phone
# (Qwen3-ASR 1.7B on the GPU through MLX, shipped inside the app: `./fetch-model.sh` puts it in Model/
# first), so it has no server and no secrets.
name: Cantonese
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift
    revision: cbad3be29480825707890490f446b19d7288be2d
  SwiftyOpenCC:
    url: https://github.com/ddddxxx/SwiftyOpenCC
    revision: 1d8105a0f7199c90af722bff62728050c858e777
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  Cantonese:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Licences/**"]
      - path: App/Licences
        buildPhase: resources
      - path: ../testdata/cantonese-16k.wav
        buildPhase: resources
      - path: Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpeechSwift
        product: Qwen3ASR
      - package: SpeechSwift
        product: SpeechVAD
      - package: SwiftyOpenCC
        product: OpenCC
    entitlements:
      path: App/Cantonese.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.cantonese
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 粵語字幕
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 用咪收音，喺部手機度即時轉做廣東話字幕。
        UILaunchScreen: {}
        # The model needs about 2.4 GB of memory: only iPhones with 8 GB (iPhone 15 Pro and later) get the app, so no
        # phone gets one it can't run (Deyao, 2026-10-28).
        UIRequiredDeviceCapabilities: [iphone-performance-gaming-tier]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSRequiresIPhoneOS: true
  CantoneseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cantonese
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.cantonese.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cantonese:
    build: { targets: { Cantonese: all, CantoneseUITests: [test] } }
    test: { targets: [CantoneseUITests] }
