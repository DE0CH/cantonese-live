# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). The relay host and the Access service
# token come from Secrets.xcconfig, which CI writes from the repo's GitHub secrets (never committed).
name: Cantonese
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  Cantonese:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../testdata/cantonese-16k.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.cantonese
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 粵語字幕
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 用咪收音，即時轉做廣東話字幕。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSRequiresIPhoneOS: true
        RelayHost: "$(RELAY_HOST)"
        AccessClientId: "$(CF_ACCESS_CLIENT_ID)"
        AccessClientSecret: "$(CF_ACCESS_CLIENT_SECRET)"
  CantoneseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cantonese
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.cantonese.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cantonese:
    build: { targets: { Cantonese: all, CantoneseUITests: [test] } }
    test: { targets: [CantoneseUITests] }
