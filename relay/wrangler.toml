# Deploy: wrangler deploy (CLOUDFLARE_API_TOKEN). Secrets (CI): SONIOX_API_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# Only reachable on the Access-gated custom domain: workers.dev and preview URLs are off.
name = "cantonese-live"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "cantonese.deyaochen.com", custom_domain = true }]

[build]
command = "node build.mjs"

[assets]
directory = "public"
binding = "ASSETS"

# The /file page's uploads: a private bucket (CORS, lifecycle: r2/*.json, applied by the relay workflow), reached
# with presigned S3 URLs only, so the Worker has no binding to it.
[vars]
R2_BUCKET = "cantonese-files"
R2_ENDPOINT = "https://ee3b4deef856baf11e1a67b242438325.r2.cloudflarestorage.com"
