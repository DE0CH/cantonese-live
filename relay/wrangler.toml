# Deploy: wrangler deploy (CLOUDFLARE_API_TOKEN). Secrets: SONIOX_API_KEY, OPENROUTER_API_KEY (CI).
# Only reachable on the Access-gated custom domain: workers.dev and preview URLs are off.
name = "cantonese-live"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "cantonese.deyaochen.com", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
