<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粵語即時字幕</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110f">
<style>
  :root {
    --bg: #faf7f2; --fg: #1d1a17; --muted: #8a8178; --line: #e6dfd5; --accent: #c2410c; --pending: #a8a097;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14110f; --fg: #f2ede6; --muted: #9a9087; --line: #2c2723; --accent: #fb923c; --pending: #6f665e; --card: #1c1815; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; letter-spacing: .02em; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px 140px; scroll-behavior: smooth; }
  #text {
    max-width: 920px; margin: 0 auto; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .pending { color: var(--pending); }
  .hint { color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 920px; margin: 0 auto; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 35%);
  }
  #mic {
    font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 999px; padding: 15px 34px;
    background: var(--accent); color: #fff; cursor: pointer; min-width: 168px;
  }
  #mic.on { background: var(--fg); color: var(--bg); }
  #pop { font: inherit; font-size: 14px; background: none; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); cursor: pointer; padding: 6px 14px; }
  @media (pointer: coarse) { #pop { display: none; } }
  body.popped header { display: none; }
  .popped-note { color: var(--muted); font-size: 16px; text-align: center; margin: 40vh 16px 0; }
  #clear { font: inherit; font-size: 15px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 10px; }
  #status { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--muted); }
  #status.err { color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .25; } }
</style>
</head>
<body>
<header>
  <h1>粵語即時字幕</h1>
  <button id="pop" title="喺一個窄身、永遠喺最面嘅小視窗顯示字幕">彈出視窗</button>
</header>
<main id="scroll">
  <p class="hint" id="hint">撳「開始」，對住咪講廣東話，字幕會即時出現。</p>
  <div id="text"><span id="done"></span><span id="segs"></span></div>
</main>
<div id="status"></div>
<footer>
  <button id="clear">清除</button>
  <button id="mic">開始</button>
</footer>
<script>
// Elements are looked up once: the pop-out moves them into another document.
const els = Object.fromEntries([...document.querySelectorAll("[id]")].map((e) => [e.id, e]));
const $ = (id) => els[id];

let session = null;
function status(msg, err) { $("status").className = err ? "err" : ""; $("status").innerHTML = msg; }
function stick() { const s = $("scroll"); if (s.scrollHeight - s.scrollTop - s.clientHeight < 200) s.scrollTop = s.scrollHeight; }

// AudioWorklet: resample the mic to 16 kHz mono s16le, posting 100 ms chunks.
const worklet = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; this.buf = new Int16Array(1600); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    while (this.pos < ch.length) {
      const s = Math.max(-1, Math.min(1, ch[Math.floor(this.pos)]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.n = 0; }
      this.pos += this.ratio;
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor("pcm16", Pcm16);`;

// Network drops are invisible. The page keeps every bit of audio Soniox hasn't finalized and treats a connection as
// disposable. The audio is cut into segments, each transcribed by its own connection; normally there is one, the live
// segment. When a connection dies (an error, a close, or 4 s without even a ping) the page opens a new one at once and
// replays the segment's audio from its last finalized point (final_ms). Soniox works through replayed audio at only
// about 1.2× real time, so a live segment that comes back with more than 1.5 s to catch up is split at the quietest
// moment of the last second (so no word is cut in two): that connection finishes the backlog, and a fresh connection
// carries on live from there. Segments show in audio order, so nothing is
// lost, repeated or out of place, and only a gap over 10 s shows a note. 停止 also survives a drop.
const BYTES_PER_MS = 32;   // 16 kHz × 2 bytes
const SPLIT_AT = 1500 * BYTES_PER_MS;
const sessions = new Set();

async function start() {
  $("hint").hidden = true;
  $("mic").textContent = "停止"; $("mic").classList.add("on");
  status("連接緊…");
  const s = session = { ctx: null, stream: null, chunks: [], recorded: 0, segs: [], downSince: 0, stopping: 0, closed: false, watch: 0 };
  sessions.add(s);
  try {
    s.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { status("用唔到咪：" + e.message, true); finish(s); return stop(true); }
  if (session !== s) { s.stream.getTracks().forEach((t) => t.stop()); return finish(s); }
  s.ctx = new AudioContext();
  await s.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "application/javascript" })));
  const node = new AudioWorkletNode(s.ctx, "pcm16");
  s.ctx.createMediaStreamSource(s.stream).connect(node);
  node.port.onmessage = (e) => {
    if (s.stopping) return;
    s.chunks.push({ at: s.recorded, buf: e.data });
    s.recorded += e.data.byteLength;
    const live = liveSeg(s);
    if (live?.live) live.ws.send(e.data);
  };
  s.watch = setInterval(() => watch(s), 1000);
  segment(s, 0, null);
}

const end = (c) => c.at + c.buf.byteLength;
const liveSeg = (s) => s.segs.find((g) => g.to === null);

// A segment covers the audio [from, to) (to = null: the live one) and shows its own text in place.
function segment(s, from, to, after) {
  const g = { s, from, to, finalAt: from, streamAt: from, commit: "", pending: "", ws: null, live: false, lastHeard: 0,
              tries: 0, done: false, c: document.createElement("span"), p: document.createElement("span") };
  g.p.className = "pending";
  const i = after ? s.segs.indexOf(after) + 1 : s.segs.length;
  s.segs.splice(i, 0, g);
  const next = s.segs[i + 1];
  $("segs").insertBefore(g.c, next ? next.c : null);
  $("segs").insertBefore(g.p, next ? next.c : null);
  connect(g);
  return g;
}

function connect(g) {
  const s = g.s;
  if (s.closed || g.done) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = g.ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  g.live = false;
  g.lastHeard = Date.now();
  ws.onmessage = (e) => {
    if (g.ws !== ws) return;
    g.lastHeard = Date.now();
    const m = JSON.parse(e.data);
    if (m.type === "ready") {
      if (g.to === null && !s.stopping && s.recorded - g.finalAt > SPLIT_AT) {
        g.to = quietest(s, Math.max(g.finalAt, s.recorded - 1000 * BYTES_PER_MS), s.recorded);   // this connection
                                      // finishes the backlog…
        segment(s, g.to, null, g);    // …and a fresh one carries on live
      }
      // The stream starts at the segment's last finalized point: replay from there, then go live or finish.
      g.streamAt = g.finalAt;
      const upTo = g.to ?? s.recorded;
      for (const c of s.chunks) {
        if (end(c) <= g.streamAt || c.at >= upTo) continue;
        ws.send(c.buf.slice(Math.max(0, g.streamAt - c.at), upTo - c.at));
      }
      if (g.to === null) g.live = true; else ws.send("stop");
      g.tries = 0;
      if (g.to === null || !liveSeg(s)) { s.downSince = 0; if (!s.stopping) status('<span class="dot"></span>聽緊'); }
    } else if (m.type === "text") {
      g.commit += m.commit;
      g.pending = m.pending;
      g.c.textContent = g.commit; g.p.textContent = g.pending;
      g.finalAt = Math.max(g.finalAt, g.streamAt + m.final_ms * BYTES_PER_MS);
      trim(s);
      stick();
    } else if (m.type === "done") {
      if (g.to === null) return drop(g, ws);   // Soniox ended the live stream on its own: carry on in a new one
      g.done = true; g.ws = null; g.pending = ""; g.p.textContent = "";
      settle(s);
    } else if (m.type === "error") console.warn("relay:", m.message);
  };
  ws.onclose = () => drop(g, ws);
}

// A segment's connection is gone: forget it and open a new one (at once, then 0.5, 1, 2… up to 5 s apart).
function drop(g, ws) {
  const s = g.s;
  if (s.closed || g.done || g.ws !== ws) return;
  g.ws = null; g.live = false;
  ws.onclose = ws.onmessage = null;
  try { ws.close(); } catch {}
  if (g.to === null) s.downSince ||= Date.now();
  const wait = g.tries ? Math.min(250 * 2 ** g.tries, 5000) : 0;
  g.tries++;
  setTimeout(() => connect(g), wait);
}

// The middle of the quietest 20 ms in the audio [lo, hi).
function quietest(s, lo, hi) {
  const win = 20 * BYTES_PER_MS;
  let best = hi, bestEnergy = Infinity, energy = 0, n = 0, at = lo;
  for (const c of s.chunks) {
    if (end(c) <= lo || c.at >= hi) continue;
    const pcm = new Int16Array(c.buf);
    for (let i = Math.max(0, (lo - c.at) >> 1); i < pcm.length && c.at + 2 * i < hi; i++) {
      if (n === 0) at = c.at + 2 * i;
      energy += pcm[i] * pcm[i];
      if (++n === win / 2) {
        if (energy < bestEnergy) { bestEnergy = energy; best = at + win / 2; }
        energy = 0; n = 0;
      }
    }
  }
  return best;
}

// Audio every segment has finalized is no longer needed.
function trim(s) {
  const need = Math.min(...s.segs.map((g) => g.finalAt));
  while (s.chunks.length && end(s.chunks[0]) <= need) s.chunks.shift();
}

// Finished segments at the front become plain text; when a stopped session has none left, it is over.
function settle(s) {
  while (s.segs[0]?.done) {
    const g = s.segs.shift();
    $("done").textContent += g.commit;
    g.c.remove(); g.p.remove();
  }
  trim(s);
  if (s.stopping && !s.segs.length) finish(s);
}

function watch(s) {
  if (s.closed) return;
  for (const g of s.segs) if (g.ws && Date.now() - g.lastHeard > 4000) drop(g, g.ws);
  if (s.downSince && Date.now() - s.downSince > 10000) status(s.stopping ? "網絡唔穩，等緊最後幾句…" : "網絡唔穩，仲錄緊音…");
  if (s.stopping && Date.now() - s.stopping > 60000) finish(s);
}

// The session is over: whatever is still pending stays as text.
function finish(s) {
  if (s.closed) return;
  s.closed = true;
  sessions.delete(s);
  clearInterval(s.watch);
  for (const g of s.segs) {
    if (g.ws) { g.ws.onclose = g.ws.onmessage = null; try { g.ws.close(); } catch {} }
    $("done").textContent += g.commit + g.pending;
    g.c.remove(); g.p.remove();
  }
  s.segs = [];
  if (!session) status("");
}

function stop(keepStatus) {
  const s = session; session = null;
  $("mic").textContent = "開始"; $("mic").classList.remove("on");
  if (!keepStatus) status("");
  if (!s || s.closed) return;
  s.stream?.getTracks().forEach((t) => t.stop());
  s.ctx?.close();
  s.stopping = Date.now();
  const g = liveSeg(s);
  if (!g) return;
  g.to = s.recorded;
  if (g.live) { g.live = false; g.ws.send("stop"); }   // otherwise the next "ready" replays and sends it
}

// Desktop pop-out: a narrow always-on-top window with no browser controls (Document Picture-in-Picture, Chrome/Edge).
// The page's own elements move into it and back when it closes; the mic and the connection stay with this tab.
// Browsers without it get a plain popup window of the same page.
$("pop").onclick = async () => {
  const size = { width: 380, height: Math.min(820, screen.availHeight - 80) };
  if (!window.documentPictureInPicture) {
    return window.open(location.href, "cantonese-popup", `popup,width=${size.width},height=${size.height}`);
  }
  if (documentPictureInPicture.window) return documentPictureInPicture.window.focus();
  const pip = await documentPictureInPicture.requestWindow(size);
  pip.document.title = document.title;
  pip.document.documentElement.lang = document.documentElement.lang;
  for (const st of document.querySelectorAll("style")) pip.document.head.append(st.cloneNode(true));
  pip.document.body.classList.add("popped");
  const moved = [...document.body.children].filter((e) => e.tagName !== "SCRIPT");
  pip.document.body.append(...moved);
  const note = document.createElement("p");
  note.className = "popped-note"; note.textContent = "字幕喺彈出視窗度。閂咗佢就會返嚟呢度。";
  document.body.append(note);
  pip.addEventListener("pagehide", () => { note.remove(); document.body.prepend(...moved); });
};

$("mic").onclick = () => session ? stop() : start();
$("clear").onclick = () => {
  $("done").textContent = "";
  for (const s of sessions) for (const g of s.segs) { g.commit = g.pending = ""; g.c.textContent = g.p.textContent = ""; }
};
</script>
</body>
</html>
