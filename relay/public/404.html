<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搵唔到呢頁</title>
<link rel="icon" href="/icon.png">
<style>
:root { --ground: #eef0f2; --panel: #ffffff; --ink: #14171a; --muted: #59626b; --rule: #d3d8dd; --st-info: #005eb8; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --ground: #111315; --panel: #1a1d20; --ink: #e8eaec; --muted: #9ea6ae; --rule: #33393f; --st-info: #5aa9ff; color-scheme: dark; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--ground); color: var(--ink); font-size: 15px; line-height: 1.5;
  font-family: "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
.sheet { background: var(--panel); }
h1 { font-size: 18px; font-weight: 700; padding: 16px; border-bottom: 1px solid var(--rule); }
a { display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule);
  color: var(--ink); font-weight: 600; text-decoration: none; }
a:last-child { border-bottom: 0; }
a:hover { background: var(--ink); color: var(--panel); }
a:focus-visible { outline: 3px solid var(--st-info); outline-offset: -3px; }
</style>
</head>
<body>
<main>
  <div class="sheet">
    <h1>搵唔到呢頁</h1>
    <a href="/">粵語即時字幕</a>
    <a href="/file">檔案轉文字</a>
  </div>
</main>
</body>
</html>
