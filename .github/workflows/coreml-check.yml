# Runs the converted model (Hugging Face DE0CH/Qwen3-ASR-1.7B-CoreML) natively on a macOS runner: compiles the
# packages, transcribes the test clip with speech-swift's MLX-free CoreML path and prints the text and stage timings.
# The runner is a VM (no Neural Engine), so this checks correctness and CPU speed, not phone speed.
name: coreml-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coreml/check/**", "coreml/verify.py", ".github/workflows/coreml-check.yml"]
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }   # coremltools' native parts have no build for newer Pythons
      - name: Model
        run: |
          pip install -q huggingface_hub
          hf download DE0CH/Qwen3-ASR-1.7B-CoreML --local-dir "$RUNNER_TEMP/m" > /dev/null
      - name: Encoder variants under debug/ against the PyTorch reference
        run: |
          pip install -q coremltools==9.0 transformers numpy
          for e in "$RUNNER_TEMP"/m/debug/*/encoder.mlpackage; do
            [ -e "$e" ] && python coreml/verify.py --encoder "$e" coreml/check/ref.npz CPU_ONLY || true
          done
      - name: Each stage against the PyTorch reference (coremltools, CPU)
        timeout-minutes: 40
        continue-on-error: true
        run: |
          python coreml/verify.py "$RUNNER_TEMP/m" coreml/check/ref.npz CPU_ONLY
      - name: Compile
        run: |
          cd "$RUNNER_TEMP/m"
          for p in *.mlpackage; do xcrun coremlcompiler compile "$p" . > /dev/null; done
          ls
      - name: Transcribe the test clip
        timeout-minutes: 45
        working-directory: coreml/check
        run: |
          swift build -c release 2>&1 | tail -3
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          .build/release/check "$RUNNER_TEMP/m" ../../testdata/cantonese-16k.wav cpu
