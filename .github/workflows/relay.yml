# The relay Worker and its web pages at cantonese.deyaochen.com. Every push: unit tests, then a browser walk of /file
# on a local Worker against the real R2 bucket and Soniox (the bucket's CORS admits http://localhost:8787 for it).
# On main: the bucket's settings (r2/*.json), the deploy with the keys from this repo's GitHub secrets, then both live
# tests through Access with the cantonese-live-ci service token. A Workers deploy switches versions atomically.
name: relay
on:
  workflow_dispatch:
  push:  # every branch (the gate merges a branch when this is green); main alone deploys
    paths: ["relay/**", "scripts/relay-test.mjs", "scripts/file-test.mjs", "testdata/**", ".github/workflows/relay.yml"]
concurrency: { group: "relay-${{ github.ref }}", cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: relay } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ee3b4deef856baf11e1a67b242438325
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: relay/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Browser and ffmpeg for the /file walk
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          npx playwright install --with-deps chromium
      - name: /file walk on a local Worker
        env:
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          printf 'SONIOX_API_KEY=%s\nR2_ACCESS_KEY_ID=%s\nR2_SECRET_ACCESS_KEY=%s\n' "$SONIOX_API_KEY" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" > .dev.vars
          npx wrangler dev --port 8787 > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787/health && break; sleep 2; done
          FILE_BASE=http://localhost:8787 node ../scripts/file-test.mjs || { tail -40 "$RUNNER_TEMP/dev.log"; exit 1; }
          rm -f .dev.vars
      - name: Bundle check (on a branch nothing is deployed)
        if: github.ref != 'refs/heads/main'
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry"
      - name: The bucket's settings
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          npx wrangler r2 bucket info cantonese-files >/dev/null 2>&1 || npx wrangler r2 bucket create cantonese-files --location apac
          npx wrangler r2 bucket cors set cantonese-files --file r2/cors.json -y
          npx wrangler r2 bucket lifecycle set cantonese-files --file r2/lifecycle.json -y
      - name: Deploy with secrets
        if: github.ref == 'refs/heads/main'
        env:
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n '{SONIOX_API_KEY: env.SONIOX_API_KEY, R2_ACCESS_KEY_ID: env.R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: env.R2_SECRET_ACCESS_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Live tests
        if: github.ref == 'refs/heads/main'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for i in 1 2 3 4 5 6; do curl -sf -o /dev/null -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" https://cantonese.deyaochen.com/health && break; sleep 10; done
          node ../scripts/relay-test.mjs
          node ../scripts/file-test.mjs
