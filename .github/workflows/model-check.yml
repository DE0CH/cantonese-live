# Runs the app's model (aufklarer/Qwen3-ASR-CoreML, Qwen3-ASR 0.6B int8 on CoreML) on a macOS runner with speech-swift's
# own CLI at the app's pinned revision: transcribes the test clip and prints the text and timing. The runner is a VM
# with no Neural Engine, so CoreML runs it on the CPU: this checks the words, not the phone's speed. The simulator UI
# test uses a stand-in for the model, so this is where CI hears it.
name: model-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/project.yml", "testdata/**", ".github/workflows/model-check.yml"]
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: speech-swift CLI at the app's revision
        run: |
          REV=$(awk '/speech-swift/{f=1} f&&/revision:/{print $2; exit}' ios/project.yml)
          git clone -q https://github.com/soniqo/speech-swift "$RUNNER_TEMP/ss" && git -C "$RUNNER_TEMP/ss" checkout -q "$REV"
          cd "$RUNNER_TEMP/ss"
          xcodebuild -downloadComponent MetalToolchain > /dev/null 2>&1 || true
          make build 2>&1 | tail -3
          sysctl -n machdep.cpu.brand_string hw.memsize
      - name: Transcribe the test clip
        run: |
          cd "$RUNNER_TEMP/ss"
          BIN=.build/release/audio
          "$BIN" transcribe "$GITHUB_WORKSPACE/testdata/cantonese-16k.wav" --engine qwen3-coreml-full 2>&1 | tail -15
          time "$BIN" transcribe "$GITHUB_WORKSPACE/testdata/cantonese-16k.wav" --engine qwen3-coreml-full 2>&1 | tail -15 | tee out.txt
          grep -q "我哋" out.txt
