# Builds the repo's Rust tools so nobody builds one from source to use it: the binary is this run's artifact
# (`gh run download -n cloudflare-access`).
name: tools
on:
  workflow_dispatch:
  push:
    paths: ["scripts/cloudflare-access/**", ".github/workflows/tools.yml"]
permissions: { contents: read }
jobs:
  cloudflare-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: scripts/cloudflare-access } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with: { name: cloudflare-access, path: scripts/cloudflare-access/target/release/cloudflare-access }
